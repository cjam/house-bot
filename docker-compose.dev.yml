# Dev overlay: stands up a local Mealie instance plus mealie-mcp
# (https://github.com/cjam/mealie-mcp), the bridge server that talks to it.
# house-bot itself runs locally with `bun run dev`, not in Docker; the
# devcontainer's docker-in-docker feature shares this shell's network namespace
# with containers it starts, so `localhost:8000` reaches mealie-mcp and
# `localhost:9925` reaches the Mealie web UI without any extra networking setup.
#
#   bun run dev:up    # starts mealie + mealie-mcp in the background
#   bun run dev       # runs house-bot locally with --watch
#
# The bridge reaches Mealie over the compose network at http://mealie:9000. It
# forwards the caller's Authorization header (house-bot's MCP_SERVERS entry) on
# to Mealie per request, falling back to its own MEALIE_API_TOKEN when no header
# is sent. So after first boot, log in to the local Mealie (http://localhost:9925),
# create an API token under your profile, and either put it in house-bot's
# MCP_SERVERS header, or set MEALIE_API_TOKEN in .env (read via env_file below) as
# a static fallback:
#   MEALIE_API_TOKEN=<local Mealie API token>

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    ports:
      - "9925:9000"
    environment:
      # SQLite is the default — no external database needed for dev.
      ALLOW_SIGNUP: "false"
      BASE_URL: http://localhost:9925
    volumes:
      - mealie-data:/app/data

  mealie-mcp:
    image: ghcr.io/cjam/mealie-mcp:main
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mealie
    ports:
      - "8000:8000"
    environment:
      MCP_TRANSPORT: http
      LOG_LEVEL: INFO
      # Point the bridge at the local Mealie over the compose network.
      MEALIE_BASE_URL: http://mealie:9000

volumes:
  mealie-data:
